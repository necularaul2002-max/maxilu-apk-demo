name: Android Demo Build

on:
  push:
    branches:
      - main
      - demo/android-ui-source
    paths:
      - "source/android/**"
      - ".github/workflows/android-demo.yml"
  pull_request:
    paths:
      - "source/android/**"
      - ".github/workflows/android-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13.2-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13.2/bin" >> "$GITHUB_PATH"

      - name: Build demo debug APK
        working-directory: source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: maxilu-apk-demo-debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
