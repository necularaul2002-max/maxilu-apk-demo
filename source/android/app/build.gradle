plugins {
    id 'com.android.application'
}

android {
    namespace 'app.maxilu.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.maxilu.demo'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
